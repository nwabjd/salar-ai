[package]
name = "salar-desktop"
version = "1.0.0"
description = "SALAR Personal Intelligence desktop client"
authors = ["SALAR"]
edition = "2021"

[lib]
name = "salar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"
open = "5"
sysinfo = "0.37"

