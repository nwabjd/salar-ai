services:
  - type: web
    name: salar-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SALAR_ENVIRONMENT
        value: production
      - key: SALAR_JWT_SECRET
        generateValue: true
      # Project URL for Supabase auth (the only login method in production).
      # Required: the backend returns 503 for Supabase login without it. Entered
      # manually in the Render dashboard (same pattern as SALAR_GEMINI_API_KEY).
      - key: SALAR_SUPABASE_URL
        sync: false
      - key: SALAR_GEMINI_API_KEY
        sync: false
      # n8n workflow automation instance for the SALAR agent (self-hosted n8n,
      # driven over its public REST API). Optional: leave empty to rely on
      # per-user connections via /api/n8n/connect.
      - key: SALAR_N8N_BASE_URL
        sync: false
      - key: SALAR_N8N_API_KEY
        sync: false
      # Seller marketplace (Amazon SP-API + noon Partner API). All credentials
      # are entered manually in the Render dashboard (never committed).
      - key: SALAR_AMAZON_SPAPI_ENABLED
        sync: false
      - key: SALAR_AMAZON_SPAPI_REGION
        sync: false
      - key: SALAR_AMAZON_LWA_CLIENT_ID
        sync: false
      - key: SALAR_AMAZON_LWA_CLIENT_SECRET
        sync: false
      - key: SALAR_AMAZON_LWA_REFRESH_TOKEN
        sync: false
      - key: SALAR_AMAZON_IAM_ACCESS_KEY
        sync: false
      - key: SALAR_AMAZON_IAM_SECRET_KEY
        sync: false
      - key: SALAR_AMAZON_SPAPI_ROLE_ARN
        sync: false
      - key: SALAR_AMAZON_MARKETPLACE_IDS
        sync: false
      - key: SALAR_AMAZON_SELLER_ID
        sync: false
      - key: SALAR_NOON_ENABLED
        sync: false
      - key: SALAR_NOON_KEY_FILE
        sync: false
      - key: SALAR_NOON_KEY_ID
        sync: false
      - key: SALAR_NOON_PRIVATE_KEY
        sync: false
      - key: SALAR_NOON_PROJECT_CODE
        sync: false
      - key: SALAR_NOON_COUNTRY_CODES
        sync: false
      - key: SALAR_NOON_WAREHOUSE_CODE
        sync: false
      - key: SALAR_GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SALAR_ALLOWED_ORIGINS
        value: '["https://salaar.cloud","https://www.salaar.cloud","http://tauri.localhost","https://tauri.localhost","tauri://localhost","null","http://127.0.0.1:4173","http://localhost:4173","http://127.0.0.1:5173","http://localhost:5173"]'
      - key: SALAR_PUBLIC_API_URL
        value: https://salar-backend.onrender.com
      # Data-at-rest encryption key for /api/vault (Fernet). Required in
      # production; the backend refuses to start vault work without it.
      - key: SALAR_VAULT_KEY
        generateValue: true
      # Shared secret between the WhatsApp bridge and the backend webhook.
      # Set once here; both processes in the container read the same value.
      - key: SALAR_WHATSAPP_WEBHOOK_SECRET
        generateValue: true
      - key: WA_BRIDGE_PORT
        value: "3100"
      - key: PORT
        value: "8000"
      - key: SALAR_BACKEND_URL
        value: http://127.0.0.1:8000
      - key: SALAR_BRIDGE_URL
        value: http://127.0.0.1:3100
      - key: WA_AUTH_DIR
        value: /app/data/wa-auth
    disk:
      name: salar-data
      mountPath: /app/data
      sizeGB: 1
