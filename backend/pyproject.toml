[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salar-backend"
version = "0.1.0"
description = "Shared internet-facing backend for SALAR clients and desktop devices"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.4,<3",
  "email-validator>=2.2,<3",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2"
]

[project.optional-dependencies]
rag = ["chromadb>=0.5,<2"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
